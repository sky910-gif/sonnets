name: Build iOS IPA (unsigned)

# 在 GitHub 云端 macOS runner 上构建 Sonnets（SwiftUI 原生 App），
# 产出【未签名】IPA。无需 Mac、无需付费 Apple 开发者账号。
# 用 Sideloadly/AltStore + 普通 Apple ID 自签安装（7 天有效）。

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/ios-ipa.yml'

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK)
        run: |
          set -x
          ls -1 /Applications | grep -i 'Xcode_26' || true
          # 选择 runner 上最新的 Xcode 26（项目使用 iOS 26 Liquid Glass API）
          XC=$(ls -d /Applications/Xcode_26.*.app 2>/dev/null | sort -V | tail -n1)
          echo "Using $XC"
          sudo xcode-select -switch "$XC"
          xcodebuild -version
          swift --version

      - name: Resolve Swift Package Manager dependencies
        run: |
          set -o pipefail
          xcodebuild \
            -project sonnets.xcodeproj \
            -scheme sonnets \
            -resolvePackageDependencies \
            -scmProvider system

      - name: Archive (CODE_SIGNING_ALLOWED=NO)
        run: |
          set -o pipefail
          xcodebuild \
            -project sonnets.xcodeproj \
            -scheme sonnets \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/sonnets.xcarchive \
            -derivedDataPath $PWD/build/derived \
            clean archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find "$PWD/build/sonnets.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未找到 .app，archive 可能失败"
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p "$PWD/build/Payload"
          cp -r "$APP_PATH" "$PWD/build/Payload/"
          cd "$PWD/build"
          zip -qr "sonnets-1.0-unsigned.ipa" Payload
          shasum -a 256 "sonnets-1.0-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonnets-unsigned-ipa
          path: build/sonnets-1.0-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
